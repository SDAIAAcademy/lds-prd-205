<noscript>
<p>فعّل JavaScript لتجيب عن الأسئلة وترى التعليل. هذه هي الأسئلة نصًّا، من دون إجاباتها.</p>
<section>
<h2>اليوم 1: من سؤال إلى نسخة أولى تعمل</h2>
<ol>
<li><p>فريق الأمتعة في قُبّرة لديه أسبوع قبل اجتماع قرار. أي صياغة تصلح سؤالًا لنموذجهم الأولي؟</p><ul><li><b>أ.</b> هل نبني صفحة جديدة لشرح قواعد الأمتعة والوزن الزائد في الموقع؟</li><li><b>ب.</b> هل يعرف المسافر رسوم وزنه الزائد من الصفحة دون أن يتصل؟</li><li><b>ج.</b> هل يعجب المسافرين تصميم الصفحة الجديدة وألوانها؟</li><li><b>د.</b> هل يستطيع النموذج اللغوي كتابة شرح بالعربية؟</li></ul></li>
<li><p>فريق الأمتعة يكتب ملفين لوكيله. أي سطر من هذه مكانه ملف السياق لا الموجز؟</p><ul><li><b>أ.</b> نريد أن نعرف هل يفهم المسافر رسوم الوزن الزائد دون اتصال.</li><li><b>ب.</b> إن فهم أربعة من خمسة نقترح مشروعًا تجريبيًا.</li><li><b>ج.</b> المستخدمون مسافرون يحجزون من الجوال.</li><li><b>د.</b> اسأل قبل إضافة أي حزمة، وشغّل التطبيق بعد كل تغيير.</li></ul></li>
<li><p>في شارح الأمتعة طلبتَ إضافة رسالة للوزن الزائد. بعد رد الوكيل لم يعد البحث عن الحجز يعمل، ولم تودع بعد. ما خطوتك التالية؟</p><ul><li><b>أ.</b> تتراجع إلى آخر إيداع، ثم تطلب الرسالة من جديد مع «لا تغيّر غير ذلك».</li><li><b>ب.</b> تطلب من الوكيل أن يصلح البحث الذي كسره، وتنتظر رده ثم تشغّل من جديد.</li><li><b>ج.</b> تودع التغيير أولًا كي لا يضيع، ثم تصلحه.</li><li><b>د.</b> تقرأ ملفات الشيفرة كلها سطرًا سطرًا لتجد السطر المكسور بنفسك.</li></ul></li>
<li><p>وكيل شارح الأمتعة يقترح وضع مفتاح النموذج في مكان «يسهّل التشغيل». أي مكان تقبله؟</p><ul><li><b>أ.</b> في ملف config.js بجوار الصفحة، ليقرأه المتصفح مباشرة.</li><li><b>ب.</b> ثابتًا في app.py مع تعليق «مؤقت».</li><li><b>ج.</b> في .env الذي يتجاهله Git، ويقرؤه البرنامج من البيئة.</li><li><b>د.</b> في NOTES.md ليجده الزملاء بسرعة حين يحتاجون إليه.</li></ul></li>
<li><p>فريق الأمتعة في قُبّرة يبني نموذجًا أوليًّا ليعرف هل يفهم المسافر رسوم وزنه الزائد دون اتصال. أي جزء يجب أن يكون حقيقيًا فيه؟</p><ul><li><b>أ.</b> ألوان الصفحة وخطوطها النهائية كما في التطبيق</li><li><b>ب.</b> حساب رسوم الوزن الزائد من قاعدة الأمتعة</li><li><b>ج.</b> تسجيل دخول المسافر بحسابه في التطبيق</li><li><b>د.</b> دفع الرسوم من الصفحة نفسها</li></ul></li>
<li><p>قرر فريق المقاعد في قُبّرة الانتقال إلى مشروع تجريبي بعد نموذج أولي ناجح. ما الذي يأخذه الفريق الهندسي من النموذج الأولي؟</p><ul><li><b>أ.</b> الشيفرة كما هي، ليبني عليها المشروع التجريبي</li><li><b>ب.</b> التصميم البصري للصفحة كما هو</li><li><b>ج.</b> ما ثبت من تعلّم، والمواصفات، وحالات التقييم</li><li><b>د.</b> لا شيء، فالمشروع التجريبي يبدأ من الصفر</li></ul></li>
<li><p>ملف السياق ينسخ سؤال المنتج كاملًا من الموجز، حتى يقرأه الوكيل في كل جلسة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في خطة وكيل لشارح الأمتعة خطوة تقول: «لتكون التجربة واقعية سأقرأ الأمتعة المسجلة من نظام المطار الحالي». أي سطر في ملف السياق كان يجب أن يمنعها؟</p><ul><li><b>أ.</b> «التشغيل: uv run app.py ثم افتح العنوان»</li><li><b>ب.</b> «التحقق: جرّب 18 و23 و32 كيلوغرامًا بعد كل خطوة»</li><li><b>ج.</b> «العمل: تغيير واحد في كل طلب»</li><li><b>د.</b> «أبدًا: بيانات مسافرين حقيقية؛ البيانات من data/ فقط»</li></ul></li>
<li><p>النموذج الأولي يُجرَّب مع مستخدمين قليلين يعرفون أنه تجربة، أما المشروع التجريبي فيقيس أثرًا في عملية حقيقية لمدة محددة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>طلبت من الوكيل تعديل نص زر في صفحة شارح الأمتعة، فأظهر git diff --stat تغييرًا في ملف البيانات أيضًا. لم تودع بعد. ما الصحيح؟</p><ul><li><b>أ.</b> تسأل عن سبب تغيّر ملف البيانات، وتتراجع إن لم يقنعك</li><li><b>ب.</b> تودع التغيير كما هو الآن، ثم تسأل الوكيل عن السبب لاحقًا</li><li><b>ج.</b> تقرأ الشيفرة كلها سطرًا سطرًا قبل أي قرار</li><li><b>د.</b> تطلب من الوكيل أن يعيد ملف البيانات كما كان</li></ul></li>
<li><p>أودعتَ الخطوة 4 من شارح المقاعد، ثم وجدت أنها أوقفت ما كان يعمل في الخطوة 2. تريد أن يبقى سجل الإيداعات كما هو. أي أمر تستعمل؟</p><ul><li><b>أ.</b> git restore .</li><li><b>ب.</b> git revert HEAD</li><li><b>ج.</b> حذف المجلد ثم البدء من نسخة قديمة</li><li><b>د.</b> git commit -m "fix"</li></ul></li>
<li><p>تريد بيانات اصطناعية لشارح الأمتعة. أي طلب إلى الوكيل هو الأنسب؟</p><ul><li><b>أ.</b> «انسخ مئة حجز من نظام الحجوزات واحذف الأسماء»</li><li><b>ب.</b> «اكتب عشرة حجوزات تعمل فيها الصفحة جيدًا للعرض»</li><li><b>ج.</b> «ولّد بيانات عشوائية مختلفة في كل تشغيل حتى تبدو التجربة واقعية أكثر»</li><li><b>د.</b> «مولّد ببذرة ثابتة فيه حقائب فوق الحد وعلى الحد، ولا أسماء»</li></ul></li>
<li><p>حد عدد الاستدعاءات في البرنامج يغني عن حد الإنفاق الذي يضعه المزوّد على المفتاح.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في تجربة شارح الأمتعة كتب النموذج في شرحه رسومًا تختلف عما يعرضه النظام. أي تصميم يمنع ذلك؟</p><ul><li><b>أ.</b> البرنامج يحسب الرسوم، والنموذج يكتب الشرح من الرقم المعطى فقط</li><li><b>ب.</b> يُطلب من النموذج في الأمر أن يحسب الرسوم بعناية أكبر ويتحقق منها بنفسه</li><li><b>ج.</b> يُحذف الرقم من الشاشة ويبقى شرح النموذج</li><li><b>د.</b> يُستبدل النموذج بنموذج أكبر وأحدث يخطئ في الأرقام أقل</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الحدود والتسليم</h2>
<ol>
<li><p>في شارح المقاعد طلبتَ إضافة رسالة لمقعد محجوز. ردّ الوكيل: «تم، واختبرت كل شيء». أيها تودعه؟</p><ul><li><b>أ.</b> التغيير بعد أن شغّلته وجرّبت المقعد المحجوز وما كان يعمل قبله.</li><li><b>ب.</b> التغيير كما هو: الوكيل قال إنه اختبره، وهذا يكفي لإيداعه الآن.</li><li><b>ج.</b> التغيير الآن، ثم تشغّله بعد الإيداع لترى هل يعمل كما وصفه الوكيل.</li><li><b>د.</b> لا شيء: كل تغيير من وكيل يُرفض أولًا.</li></ul></li>
<li><p>بنى فريق المقاعد شارحًا جرّبوه على خمسة حجوزات، كلها لمسافر واحد في رحلة واحدة، فنجح كل شيء. أي فحص تضيفه أولًا؟</p><ul><li><b>أ.</b> حجز سادس لمسافر واحد في رحلة واحدة، بالرقم المتوقع مكتوبًا قبل التشغيل.</li><li><b>ب.</b> أن تُفتح الصفحة في أقل من ثانيتين.</li><li><b>ج.</b> حجز لأربعة مسافرين على رحلتين، بالرقم المتوقع مكتوبًا.</li><li><b>د.</b> أن يكون الشرح مقنعًا للمسافر وواضحًا في رأي أعضاء الفريق.</li></ul></li>
<li><p>نسخة شارح الأمتعة قبل اختبار الغد فيها أربعة حدود. أيها يأتي أولًا في القائمة المرتبة؟</p><ul><li><b>أ.</b> حقل الوزن بلا عنوان مرئي، فلا يعرف قارئ الشاشة ما يُكتب فيه.</li><li><b>ب.</b> مفتاح النموذج مكتوب في ملف تحمّله الصفحة.</li><li><b>ج.</b> مسار ملف القواعد على جهاز المصمم.</li><li><b>د.</b> حزمة في ملف المتطلبات دون إصدار مثبت ودون أن يسأل عنها أحد.</li></ul></li>
<li><p>بعد خمس جلسات على شارح المقاعد، أي سطر يكتبه الفريق في قسم «ما ثبت» من حزمة التسليم؟</p><ul><li><b>أ.</b> الصفحة سهلة وواضحة في رأي كل من بناها في الفريق.</li><li><b>ب.</b> 80% من المسافرين سيستعملون الصفحة بدل الاتصال بمركز الاتصال.</li><li><b>ج.</b> الشيفرة مكتوبة بمكتبة Python القياسية دون أي حزمة إضافية.</li><li><b>د.</b> أربعة من خمسة بحثوا عن زر لاختيار المقعد، فظنوا الصفحة تنفّذ.</li></ul></li>
<li><p>جرّب فريق المقاعد نموذجه على خمسة حجوزات، كلها لمسافر واحد ورحلة واحدة، فنجح كل شيء. أي فحص يكشف وهم المسار المثالي هنا؟</p><ul><li><b>أ.</b> فحص أن الصفحة تُفتح بسرعة على الجوال وعلى الحاسوب معًا</li><li><b>ب.</b> فحص حجز لمسافر واحد في رحلة صباحية</li><li><b>ج.</b> فحص حجز لثلاثة مسافرين على رحلتين، ورمز غير موجود</li><li><b>د.</b> فحص أن الشرح باللغة العربية</li></ul></li>
<li><p>أي صياغة فحص قبول لشارح الأمتعة يستطيع زميل أن يحكم عليها بـ«اجتاز» أو «أخفق» بعد التشغيل؟</p><ul><li><b>أ.</b> «الصفحة تشرح رسوم الحقيبة الثانية بوضوح لكل مسافر يفتحها»</li><li><b>ب.</b> «معطى: حقيبتان 23 و27 كغ في باقة 23 كغ؛ عند العرض: رسوم الحقيبة الثانية وحدها»</li><li><b>ج.</b> «الذكاء الاصطناعي يكتب شرحًا جيدًا لكل الحجوزات التي نجربها»</li><li><b>د.</b> «المسافرون في الاختبار سيحبون الشرح المختصر أكثر من القديم»</li></ul></li>
<li><p>وجدتَ في نسخة «جاهزة للعرض» من شارح المقاعد أربعة حدود. أيها يأتي أولًا في القائمة المرتبة قبل أي جلسة مع مستخدمين؟</p><ul><li><b>أ.</b> ملف فيه أسماء وأرقام هوية «من تصدير النظام»</li><li><b>ب.</b> حقل بلا عنوان مرئي</li><li><b>ج.</b> حزمة أضافها الوكيل دون أن يسأل ودون إصدار مثبت في الملف</li><li><b>د.</b> مسار ملف على جهاز المصمم</li></ul></li>
<li><p>الفحص الآلي يجد بعض الحدود، مثل الأسرار والمسارات والحزم، وتبقى إمكانية الوصول والتراخيص والإفصاح للفحص اليدوي.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في نموذج شارح الأمتعة صورة حقيبة لا يعرف أحد من أين جاءت. ما الصحيح قبل الاختبار مع المستخدمين؟</p><ul><li><b>أ.</b> تبقى كما هي، لأن النموذج الأولي لا يُنشر على الإنترنت ولا يراه إلا الفريق</li><li><b>ب.</b> تبقى إن كانت مولَّدة، فالمولَّد لا ترخيص له</li><li><b>ج.</b> تُصغَّر حتى لا تُلاحظ</li><li><b>د.</b> تُحذف، أو تُستبدل بأصل معروف المصدر والترخيص ويُكتب مصدره</li></ul></li>
<li><p>في خمس جلسات مع شارح المقاعد: أربعة سألوا «أين أختار المقعد؟»، واثنان لم يجدا رمز الحجز، وواحد قال إن الألوان باهتة. ما الذي يدخل حزمة التسليم بوصفه تعلّمًا ثبت؟</p><ul><li><b>أ.</b> الألوان الباهتة، لأنها أسهل ما يُصلح</li><li><b>ب.</b> أربعة من خمسة ظنوا أن الصفحة تنفّذ الاختيار، ومعه الدليل</li><li><b>ج.</b> كل ملاحظة بالوزن نفسه، دون عدّ</li><li><b>د.</b> لا شيء، فخمسة مستخدمين عدد صغير</li></ul></li>
<li><p>يسلّم فريق الأمتعة نموذجه إلى المهندس. أي جزء يُوضع في عمود «يُستبعد»؟</p><ul><li><b>أ.</b> قاعدة حساب الرسوم مكتوبة بالكلمات</li><li><b>ب.</b> الحالات التي يجب أن ينجح فيها أي إصدار لاحق</li><li><b>ج.</b> ملف app.py الذي كتبه الوكيل لسؤال واحد</li><li><b>د.</b> نتائج الجلسات الخمس وما تقوله عن السؤال</li></ul></li>
<li><p>يُبلَّغ كل مستخدم في الاختبار، قبل الجلسة، أن الشرح في النموذج الأولي يكتبه الذكاء الاصطناعي.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>من يراجع حزمة تسليم شارح الأمتعة قبل أن تقرر مديرة المنتج المشروع التجريبي؟</p><ul><li><b>أ.</b> مهندس من الفريق الهندسي لم يشارك في بناء النموذج الأولي</li><li><b>ب.</b> المصمم الذي بنى النموذج مع الوكيل</li><li><b>ج.</b> وكيل البرمجة نفسه، بطلب مراجعة</li><li><b>د.</b> مديرة المنتج وحدها، لأنها صاحبة الفكرة وصاحبة القرار في المشروع التجريبي</li></ul></li>
</ol>
